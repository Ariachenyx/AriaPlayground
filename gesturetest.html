    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* Custom font & styling */
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap');

        body {
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0b132b;
            color: #ffffff;
            overflow: hidden;
            user-select: none;
        }

        /* Glassmorphism UI panel */
        .glass-panel {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        /* Custom pulsing glowing effects */
        .glow-pulse {
            animation: pulseGlow 2s infinite alternate;
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 15px rgba(56, 189, 248, 0.4); }
            100% { box-shadow: 0 0 30px rgba(186, 230, 253, 0.8); }
        }

        /* Equalizer Music Bars Animation */
        @keyframes eqBounce {
            0%, 100% { height: 4px; }
            50% { height: 14px; }
        }
        .eq-bar {
            width: 3px;
            border-radius: 999px;
            background-color: #fde047;
            animation: eqBounce 0.6s ease-in-out infinite;
        }
        .eq-bar:nth-child(2) { animation-delay: 0.15s; }
        .eq-bar:nth-child(3) { animation-delay: 0.3s; }
        .eq-paused .eq-bar {
            animation: none;
            height: 4px;
            background-color: #94a3b8;
        }

        /* Canvas layering */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        #webcam {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
            display: none;
        }
    </style>
</head>

    <!-- Main Interactive Script Logic -->
    <script>
        /**
         * Pure Web Audio API Real-Time Synthesizer Engine
         * 100 BPM Rhythm Heaven Call-and-Response Winter Arrangement (Zero external URLs / Zero Blob URLs)
         */
        class SoundEngine {
            constructor() {
                this.ctx = null;
                this.muted = true;
                this.bgmTimer = null;
                this.stepIndex = 0;
            }
            init() {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return null;
                if (!this.ctx) {
                    this.ctx = new AudioCtx();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume().catch(() => {});
                }
                return this.ctx;
            }
            updateStatusBadge() {
                const btn = document.getElementById('audioBtn');
                const label = document.getElementById('audioLabel');
                if (!btn || !label) return;
                if (!this.muted) {
                    btn.className = 'p-2.5 rounded-xl bg-gradient-to-r from-amber-500/40 to-orange-500/40 border border-amber-300/80 text-amber-100 transition-all duration-300 active:scale-95 flex items-center gap-2 px-3.5 text-xs font-bold shadow-lg shadow-amber-500/30';
                    label.textContent = '音乐中 ♪';
                } else {
                    btn.className = 'eq-paused p-2.5 rounded-xl bg-white/10 hover:bg-white/20 border border-white/20 text-slate-300 transition-all duration-300 active:scale-95 flex items-center gap-2 px-3.5 text-xs font-bold';
                    label.textContent = '开启音乐';
                }
            }
            startBgm() {
                this.init();
                this.muted = false;
                this.updateStatusBadge();
                if (this.bgmTimer) return;
                // 100 BPM -> 1 quarter note = 600ms, 16th note step = 150ms (32 steps = 8 beats Call & Response)
                this.stepIndex = 0;
                this.playBgmStep(0);
                this.bgmTimer = setInterval(() => {
                    this.stepIndex = (this.stepIndex + 1) % 32;
                    this.playBgmStep(this.stepIndex);
                }, 150);
            }
            reinitAfterCamera() {
                // Rebuild AudioContext after getUserMedia() so macOS/Chrome CoreAudio route stays attached
                this.stopBgm();
                if (this.ctx) {
                    try { this.ctx.close(); } catch (_) {}
                    this.ctx = null;
                }
                this.startBgm();
            }
            stopBgm() {
                if (this.bgmTimer) {
                    clearInterval(this.bgmTimer);
                    this.bgmTimer = null;
                }
            }
            toggleMute() {
                this.init();
                if (this.muted) {
                    this.startBgm();
                } else {
                    this.muted = true;
                    this.stopBgm();
                    this.updateStatusBadge();
                }
                return this.muted;
            }
            playTone(freq, type, duration, gainVal, delay = 0) {
                if (this.muted || !freq) return;
                this.init();
                if (!this.ctx) return;
                try {
                    const now = this.ctx.currentTime + delay;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, now);
                    gain.gain.setValueAtTime(gainVal, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now);
                    osc.stop(now + duration + 0.02);
                } catch (_) {}
            }
            playNoise(duration, gainVal) {
                if (this.muted) return;
                this.init();
                if (!this.ctx) return;
                try {
                    const sampleRate = this.ctx.sampleRate;
                    const length = Math.floor(sampleRate * duration);
                    const buffer = this.ctx.createBuffer(1, length, sampleRate);
                    const data = buffer.getChannelData(0);
                    for (let i = 0; i < length; i++) {
                        data[i] = Math.random() * 2 - 1;
                    }
                    const src = this.ctx.createBufferSource();
                    src.buffer = buffer;
                    const filter = this.ctx.createBiquadFilter();
                    filter.type = 'highpass';
                    filter.frequency.value = 3500;
                    const gain = this.ctx.createGain();
                    const now = this.ctx.currentTime;
                    gain.gain.setValueAtTime(gainVal, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
                    src.connect(filter);
                    filter.connect(gain);
                    gain.connect(this.ctx.destination);
                    src.start(now);
                } catch (_) {}
            }
            playBgmStep(step) {
                if (this.muted) return;
                const isPlayerTurn = step >= 16;
                const beatInBar = Math.floor((step % 16) / 4); // 0, 1, 2, 3
                const subStep = step % 4; // 0, 1, 2, 3 (16th notes)

                // 1. Bouncy Octave Triangle Bass (on beat & off-beat)
                const bassRoots = [130.81, 130.81, 174.61, 196.00]; // C3, C3, F3, G3
                const root = bassRoots[beatInBar];
                if (subStep === 0) {
                    this.playTone(root, 'triangle', 0.22, 0.22);
                } else if (subStep === 2) {
                    this.playTone(root * 2, 'triangle', 0.16, 0.16);
                }

                // 2. Crisp Percussion (Kick on 0,2; Snare + Hi-hat boosted in Player Turn)
                if (subStep === 0 && (beatInBar === 0 || beatInBar === 2)) {
                    this.playTone(110, 'sine', 0.12, isPlayerTurn ? 0.28 : 0.18);
                }
                if (subStep === 0 && (beatInBar === 1 || beatInBar === 3)) {
                    this.playNoise(0.09, isPlayerTurn ? 0.14 : 0.07);
                } else if (subStep === 2) {
                    this.playNoise(0.04, 0.04); // Sleigh hi-hat
                }

                // 3. Celesta / Music-Box Call & Response Melody (Jingle Bells x Rhythm Heaven syncopation)
                const demoMelody = {
                    0: 659.25, 2: 659.25, 4: 659.25,       // E5 E5 E5
                    8: 659.25, 10: 783.99, 12: 1046.50     // E5 G5 C6 (Cue!)
                };
                const playerMelody = {
                    16: 523.25, 18: 587.33, 20: 659.25,    // C5 D5 E5 (Hold 1-2-3)
                    24: 783.99, 28: 1318.51                // G5 -> E6 (Beat 4 Release!)
                };
                const noteFreq = isPlayerTurn ? playerMelody[step] : demoMelody[step];
                if (noteFreq) {
                    this.playTone(noteFreq, 'sine', 0.26, 0.22);
                    this.playTone(noteFreq * 2, 'sine', 0.14, 0.06); // Bell overtone
                }
            }
            syncClock() {}
            playPoke() {
                this.playTone(440, 'sine', 0.14, 0.25, 0);
                this.playTone(660, 'sine', 0.18, 0.25, 0.07);
            }
            playSplat() {
                this.playTone(150, 'triangle', 0.18, 0.30, 0);
            }
            playCharge(progress) {
                if (Math.random() > 0.25) return;
                this.playTone(220 + progress * 380, 'triangle', 0.06, 0.12);
            }
            playBeat(beatIndex, isPlayerTurn, isTargetBeat) {
                if (isTargetBeat) {
                    this.playTone(isPlayerTurn ? 1318.5 : 1046.5, 'sine', 0.12, 0.20);
                } else {
                    this.playTone(isPlayerTurn ? 587.33 : 493.88, 'sine', 0.06, 0.10);
                }
            }
            playPerfect() {
                [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((freq, idx) => {
                    this.playTone(freq, 'triangle', 0.24, 0.24, idx * 0.045);
                });
            }
        }

        const soundEngine = new SoundEngine();

        /**
         * Global Application State & DOM Elements
         */
        const video = document.getElementById('webcam');
        const bgCanvas = document.getElementById('bgCanvas');
        const frostCanvas = document.getElementById('frostCanvas');
        const uiCanvas = document.getElementById('uiCanvas');
        const bgCtx = bgCanvas.getContext('2d');
        const frostCtx = frostCanvas.getContext('2d');
        const uiCtx = uiCanvas.getContext('2d');

        // Offscreen buffer for persistent frosted glass mask (separates wiped frost from sliding snow splats)
        const frostMaskCanvas = document.createElement('canvas');
        const frostMaskCtx = frostMaskCanvas.getContext('2d');

        const threadText = document.getElementById('threadText');
        const threadStatus = document.getElementById('threadStatus');
        const gestureIcon = document.getElementById('gestureIcon');
        const gestureText = document.getElementById('gestureText');
        const snowBar = document.getElementById('snowBar');
        const snowPercent = document.getElementById('snowPercent');
        const comboCountText = document.getElementById('comboCountText');
        const rhythmPhaseBadge = document.getElementById('rhythmPhaseBadge');
        const rhythmTargetLabel = document.getElementById('rhythmTargetLabel');
        const rhythmFeedbackText = document.getElementById('rhythmFeedbackText');
        const beatDots = [
            document.getElementById('beatDot0'),
            document.getElementById('beatDot1'),
            document.getElementById('beatDot2'),
            document.getElementById('beatDot3')
        ];
        const refrostBtn = document.getElementById('refrostBtn');
        const audioBtn = document.getElementById('audioBtn');
        const permissionModal = document.getElementById('permissionModal');
        const modalDesc = document.getElementById('modalDesc');
        const startBtn = document.getElementById('startBtn');

        let width = window.innerWidth;
        let height = window.innerHeight;

        // Interaction state variables
        let snowAccumulation = 10; // 0 to 100%
        let lastWipePos = null;
        let chargeProgress = 0; // 0 to 1
        let lastChargedTime = 0;
        let savedCharge = 0;
        let flyingSnowballs = [];
        let snowSplats = [];
        let snowflakes = [];

        // Rhythm Heaven Style Call-and-Response Engine (100 BPM = 600ms per beat)
        const RHYTHM_CHALLENGE = {
            id: 'HOLD_AND_THROW',
            gesture: 'OPEN_PALM',
            label: '1-2-3 握拳蓄力 → 第 4 拍张掌！',
            demoIcon: '🖐️',
            demoHint: '示范：✊ 1 - ✊ 2 - ✊ 3 - 【🖐️ 第4拍发射！】'
        };

        const rhythmState = {
            active: false,
            bpm: 100,
            beatIntervalMs: 600,
            startTime: 0,
            lastGlobalBeat: -1,
            holdBeatsCount: 0,
            playerHitThisRound: false,
            combo: 0,
            demoPulse: 0
        };

        // Classic Cute Snowman Interactive State
        let snowman = {
            x: 0,
            y: 0,
            wobbleAngle: 0,
            wobbleVel: 0,
            headTilt: 0,
            blinkTimer: 0,
            isBlinking: false,
            lastPokeTime: 0
        };

        // Hand tracking smoothing, buffering & fault tolerance
        let smoothedLandmarks = null;
        let gestureHistory = [];
        const HISTORY_LEN = 4;
        let confirmedGesture = 'IDLE';
        let lastDetectTime = 0;
        const LOST_TOLERANCE_MS = 280;

        // MediaPipe Worker / Main-Thread Fallback State
        let handWorker = null;
        let mainHandLandmarker = null;
        let isProcessingFrame = false;
        let lastInferTime = 0;
        const INFER_INTERVAL_MS = 33; // ~30 FPS inference cap for smooth rendering

        const MP_VISION_URL = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";
        const MP_WASM_DIR = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm";
        const LOCAL_MODEL_URL = "./hand_landmarker.task";
        const REMOTE_MODEL_URL = "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task";

        /**
         * Resolve available model URL (prefer same-origin local file if deployed alongside HTML)
         */
        async function resolveModelUrl() {
            try {
                const probe = await fetch(LOCAL_MODEL_URL, { method: 'HEAD' });
                if (probe.ok) return LOCAL_MODEL_URL;
            } catch (_) {}
            return REMOTE_MODEL_URL;
        }

        /**
         * Initialize Frosted Glass Layer
         */
        function initFrostLayer() {
            frostMaskCtx.globalCompositeOperation = 'source-over';
            frostMaskCtx.clearRect(0, 0, width, height);

            const frostGrad = frostMaskCtx.createLinearGradient(0, 0, width, height);
            frostGrad.addColorStop(0, 'rgba(219, 234, 254, 0.72)');
            frostGrad.addColorStop(0.5, 'rgba(186, 230, 253, 0.65)');
            frostGrad.addColorStop(1, 'rgba(224, 242, 254, 0.75)');
            frostMaskCtx.fillStyle = frostGrad;
            frostMaskCtx.fillRect(0, 0, width, height);

            // Subtle ice crystal grain texture
            frostMaskCtx.fillStyle = 'rgba(255, 255, 255, 0.14)';
            for (let i = 0; i < 900; i++) {
                const fx = Math.random() * width;
                const fy = Math.random() * height;
                const fr = 1 + Math.random() * 2.5;
                frostMaskCtx.beginPath();
                frostMaskCtx.arc(fx, fy, fr, 0, Math.PI * 2);
                frostMaskCtx.fill();
            }
        }

        /**
         * Smooth Interpolated Wiping (clears frost without leaving white lines)
         */
        function wipeFrostInterpolated(fromPos, toPos) {
            frostMaskCtx.save();
            frostMaskCtx.globalCompositeOperation = 'destination-out';
            frostMaskCtx.lineCap = 'round';
            frostMaskCtx.lineJoin = 'round';

            const brushRadius = 46;
            const start = fromPos || toPos;
            const dx = toPos.x - start.x;
            const dy = toPos.y - start.y;
            const dist = Math.hypot(dx, dy);
            const steps = Math.max(1, Math.ceil(dist / 8));

            for (let i = 0; i <= steps; i++) {
                const t = i / steps;
                const ix = start.x + dx * t;
                const iy = start.y + dy * t;

                const grad = frostMaskCtx.createRadialGradient(ix, iy, brushRadius * 0.25, ix, iy, brushRadius);
                grad.addColorStop(0, 'rgba(0, 0, 0, 1)');
                grad.addColorStop(0.7, 'rgba(0, 0, 0, 0.7)');
                grad.addColorStop(1, 'rgba(0, 0, 0, 0)');

                frostMaskCtx.fillStyle = grad;
                frostMaskCtx.beginPath();
                frostMaskCtx.arc(ix, iy, brushRadius, 0, Math.PI * 2);
                frostMaskCtx.fill();
            }
            frostMaskCtx.restore();
        }

        /**
         * Initialize & Update Real-Time Falling Snowflakes
         */
        function initSnowflakes() {
            snowflakes = [];
            const count = Math.min(110, Math.floor((width * height) / 14000));
            for (let i = 0; i < count; i++) {
                snowflakes.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    r: 1.5 + Math.random() * 3.5,
                    vy: 0.9 + Math.random() * 1.8,
                    vx: (Math.random() - 0.5) * 0.6,
                    phase: Math.random() * Math.PI * 2
                });
            }
        }

        function updateSnowMeterUI() {
            const pct = Math.round(snowAccumulation);
            if (snowBar) snowBar.style.width = `${pct}%`;
            if (snowPercent) snowPercent.textContent = `${pct}%`;
        }

        function updateAndDrawSnowflakes() {
            bgCtx.save();
            bgCtx.fillStyle = 'rgba(255, 255, 255, 0.85)';
            for (const f of snowflakes) {
                f.phase += 0.025;
                f.x += f.vx + Math.sin(f.phase) * 0.45;
                f.y += f.vy;

                if (f.y > height - 20) {
                    f.y = -8;
                    f.x = Math.random() * width;
                    if (snowAccumulation < 100) {
                        snowAccumulation = Math.min(100, snowAccumulation + 0.04);
                        updateSnowMeterUI();
                    }
                }
                if (f.x < 0) f.x = width;
                if (f.x > width) f.x = 0;

                bgCtx.beginPath();
                bgCtx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
                bgCtx.fill();
            }
            bgCtx.restore();
        }

        function resizeCanvases() {
            let tempCanvas = null;
            if (frostMaskCanvas.width > 0 && frostMaskCanvas.height > 0) {
                tempCanvas = document.createElement('canvas');
                tempCanvas.width = frostMaskCanvas.width;
                tempCanvas.height = frostMaskCanvas.height;
                tempCanvas.getContext('2d').drawImage(frostMaskCanvas, 0, 0);
            }

            width = window.innerWidth;
            height = window.innerHeight;

            bgCanvas.width = width;
            bgCanvas.height = height;
            frostCanvas.width = width;
            frostCanvas.height = height;
            uiCanvas.width = width;
            uiCanvas.height = height;
            frostMaskCanvas.width = width;
            frostMaskCanvas.height = height;

            if (tempCanvas) {
                frostMaskCtx.drawImage(tempCanvas, 0, 0, width, height);
            } else {
                initFrostLayer();
            }

            snowman.x = width * 0.78;
            snowman.y = height - 45;
        }

        window.addEventListener('resize', resizeCanvases);

        /**
         * Draw Ground Snow Drift & Progressive Cute Snowman
         * Order: Stage 1 (>=18%): Hat & Face -> Stage 2 (>=50%): Round Body -> Stage 3 (>=80%): Scarf & Twig Arms
         */
        function drawSnowGroundAndSnowman(now) {
            const groundHeight = 26 + (snowAccumulation / 100) * 58;
            const groundTopY = height - groundHeight;

            // Ground snow bank
            bgCtx.save();
            const groundGrad = bgCtx.createLinearGradient(0, groundTopY - 15, 0, height);
            groundGrad.addColorStop(0, 'rgba(240, 249, 255, 0.94)');
            groundGrad.addColorStop(1, 'rgba(186, 230, 253, 0.98)');
            bgCtx.fillStyle = groundGrad;
            bgCtx.beginPath();
            bgCtx.moveTo(0, height);
            bgCtx.lineTo(0, groundTopY + 8);
            bgCtx.bezierCurveTo(width * 0.3, groundTopY - 14, width * 0.7, groundTopY + 14, width, groundTopY - 6);
            bgCtx.lineTo(width, height);
            bgCtx.closePath();
            bgCtx.fill();
            bgCtx.restore();

            // Update snowman spring wobble & blinking
            snowman.wobbleVel += -snowman.wobbleAngle * 0.14;
            snowman.wobbleVel *= 0.84;
            snowman.wobbleAngle += snowman.wobbleVel;

            if (now - snowman.blinkTimer > 3100) {
                snowman.isBlinking = true;
                if (now - snowman.blinkTimer > 3280) {
                    snowman.isBlinking = false;
                    snowman.blinkTimer = now;
                }
            }

            // Stage growth interpolation
            const stage1Grow = Math.max(0, Math.min(1, (snowAccumulation - 18) / 15)); // Hat & Face
            const stage2Grow = Math.max(0, Math.min(1, (snowAccumulation - 50) / 18)); // Round Body
            const stage3Grow = Math.max(0, Math.min(1, (snowAccumulation - 80) / 15)); // Scarf & Twig Arms

            if (stage1Grow <= 0) return;

            snowman.x = width * 0.78;
            snowman.y = groundTopY - 6;

            bgCtx.save();
            bgCtx.translate(snowman.x, snowman.y);
            bgCtx.rotate(snowman.wobbleAngle);

            const bodyRadius = 56 * stage2Grow;
            const headRadius = 38 * stage1Grow;
            const headCenterY = -headRadius * 0.78 - bodyRadius * 1.48;

            // Stage 2: Snowman Round Body
            if (stage2Grow > 0.02) {
                const bodyCenterY = -bodyRadius * 0.78;
                const bodyGrad = bgCtx.createRadialGradient(-12, bodyCenterY - 12, 6, 0, bodyCenterY, bodyRadius);
                bodyGrad.addColorStop(0, '#ffffff');
                bodyGrad.addColorStop(1, '#dbeafe');
                bgCtx.fillStyle = bodyGrad;
                bgCtx.beginPath();
                bgCtx.arc(0, bodyCenterY, bodyRadius, 0, Math.PI * 2);
                bgCtx.fill();

                // Coal buttons on body
                bgCtx.fillStyle = '#1e293b';
                [-10, 12].forEach(dy => {
                    bgCtx.beginPath();
                    bgCtx.arc(0, bodyCenterY + dy * stage2Grow, 4 * stage2Grow, 0, Math.PI * 2);
                    bgCtx.fill();
                });

                // Stage 3: Scarf & Twig Arms
                if (stage3Grow > 0.02) {
                    // Twig Arms
                    bgCtx.strokeStyle = '#78350f';
                    bgCtx.lineWidth = 4.5 * stage3Grow;
                    bgCtx.lineCap = 'round';
                    // Left arm
                    bgCtx.beginPath();
                    bgCtx.moveTo(-bodyRadius * 0.85, bodyCenterY - 8);
                    bgCtx.lineTo(-bodyRadius - 32 * stage3Grow, bodyCenterY - 28 * stage3Grow);
                    bgCtx.moveTo(-bodyRadius - 18 * stage3Grow, bodyCenterY - 19 * stage3Grow);
                    bgCtx.lineTo(-bodyRadius - 24 * stage3Grow, bodyCenterY - 35 * stage3Grow);
                    // Right arm
                    bgCtx.moveTo(bodyRadius * 0.85, bodyCenterY - 8);
                    bgCtx.lineTo(bodyRadius + 32 * stage3Grow, bodyCenterY - 28 * stage3Grow);
                    bgCtx.moveTo(bodyRadius + 18 * stage3Grow, bodyCenterY - 19 * stage3Grow);
                    bgCtx.lineTo(bodyRadius + 24 * stage3Grow, bodyCenterY - 35 * stage3Grow);
                    bgCtx.stroke();

                    // Cozy Red-Gold Striped Scarf
                    const neckY = headCenterY + headRadius * 0.82;
                    bgCtx.fillStyle = '#ef4444';
                    bgCtx.beginPath();
                    bgCtx.roundRect(-34 * stage3Grow, neckY - 6, 68 * stage3Grow, 14 * stage3Grow, 7);
                    bgCtx.fill();
                    // Hanging scarf tail
                    bgCtx.beginPath();
                    bgCtx.roundRect(12 * stage3Grow, neckY + 2, 15 * stage3Grow, 32 * stage3Grow, 6);
                    bgCtx.fill();
                    bgCtx.fillStyle = '#facc15';
                    bgCtx.fillRect(12 * stage3Grow, neckY + 22 * stage3Grow, 15 * stage3Grow, 4 * stage3Grow);
                }
            }

            // Stage 1: Snowman Face & Winter Top Hat (grows first!)
            bgCtx.save();
            bgCtx.translate(0, headCenterY);
            bgCtx.rotate(snowman.headTilt * Math.sin(now * 0.008));

            const headGrad = bgCtx.createRadialGradient(-10, -10, 4, 0, 0, headRadius);
            headGrad.addColorStop(0, '#ffffff');
            headGrad.addColorStop(1, '#e0f2fe');
            bgCtx.fillStyle = headGrad;
            bgCtx.beginPath();
            bgCtx.arc(0, 0, headRadius, 0, Math.PI * 2);
            bgCtx.fill();

            // Rosy Cheeks
            bgCtx.fillStyle = 'rgba(251, 113, 133, 0.45)';
            bgCtx.beginPath();
            bgCtx.arc(-16 * stage1Grow, 4 * stage1Grow, 6 * stage1Grow, 0, Math.PI * 2);
            bgCtx.arc(16 * stage1Grow, 4 * stage1Grow, 6 * stage1Grow, 0, Math.PI * 2);
            bgCtx.fill();

            // Eyes (blink support)
            bgCtx.fillStyle = '#0f172a';
            bgCtx.strokeStyle = '#0f172a';
            bgCtx.lineWidth = 2.5;
            if (snowman.isBlinking) {
                bgCtx.beginPath();
                bgCtx.arc(-12 * stage1Grow, -6 * stage1Grow, 4.5 * stage1Grow, 0, Math.PI);
                bgCtx.stroke();
                bgCtx.beginPath();
                bgCtx.arc(12 * stage1Grow, -6 * stage1Grow, 4.5 * stage1Grow, 0, Math.PI);
                bgCtx.stroke();
            } else {
                bgCtx.beginPath();
                bgCtx.arc(-12 * stage1Grow, -6 * stage1Grow, 3.8 * stage1Grow, 0, Math.PI * 2);
                bgCtx.arc(12 * stage1Grow, -6 * stage1Grow, 3.8 * stage1Grow, 0, Math.PI * 2);
                bgCtx.fill();
            }

            // Carrot Nose
            bgCtx.fillStyle = '#f97316';
            bgCtx.beginPath();
            bgCtx.moveTo(0, -1 * stage1Grow);
            bgCtx.lineTo(-16 * stage1Grow, 4 * stage1Grow);
            bgCtx.lineTo(0, 7 * stage1Grow);
            bgCtx.closePath();
            bgCtx.fill();

            // Cute Smile
            bgCtx.beginPath();
            bgCtx.arc(0, 9 * stage1Grow, 9 * stage1Grow, 0.15 * Math.PI, 0.85 * Math.PI);
            bgCtx.stroke();

            // Cute Festive Hat on top of head
            bgCtx.save();
            bgCtx.translate(4 * stage1Grow, -headRadius * 0.82);
            bgCtx.rotate(0.16);
            bgCtx.fillStyle = '#1e293b';
            bgCtx.beginPath();
            bgCtx.roundRect(-28 * stage1Grow, -4 * stage1Grow, 56 * stage1Grow, 8 * stage1Grow, 4);
            bgCtx.fill();
            bgCtx.beginPath();
            bgCtx.roundRect(-18 * stage1Grow, -30 * stage1Grow, 36 * stage1Grow, 28 * stage1Grow, 5);
            bgCtx.fill();
            // Red ribbon band
            bgCtx.fillStyle = '#ef4444';
            bgCtx.fillRect(-18 * stage1Grow, -10 * stage1Grow, 36 * stage1Grow, 5 * stage1Grow);
            bgCtx.restore();

            bgCtx.restore();
            bgCtx.restore();

            // Decay head tilt smoothly
            snowman.headTilt *= 0.94;
        }

        /**
         * Check if index finger pokes the Snowman
         */
        function checkSnowmanPoke(fx, fy, now) {
            if (snowAccumulation < 18) return;
            const hitRadius = 85;
            const distToHead = Math.hypot(fx - snowman.x, fy - (snowman.y - 45));
            const distToBody = Math.hypot(fx - snowman.x, fy - (snowman.y - 10));
            if ((distToHead < hitRadius || distToBody < hitRadius) && now - snowman.lastPokeTime > 450) {
                snowman.lastPokeTime = now;
                snowman.wobbleVel = (fx < snowman.x ? 1 : -1) * 0.22;
                snowman.headTilt = (fx < snowman.x ? 1 : -1) * 0.25;
                snowman.blinkTimer = now - 3110;
                soundEngine.playPoke();
                updateGesturePill('⛄ 戳到小雪人啦！眨眼摇晃中~', 'fa-face-smile-beam', 'text-emerald-300');
            }
        }

        /**
         * Rhythm Heaven Call-and-Response Loop (Beats 0-3: Demo, Beats 4-7: Player)
         * Beats 1-3: Hold Fist to charge snowball -> Beat 4: Open Palm to launch!
         */
        function updateRhythmEngine(now) {
            if (!rhythmState.active) return;
            soundEngine.syncClock(now, rhythmState.startTime, rhythmState.beatIntervalMs);
            const elapsed = now - rhythmState.startTime;
            const globalBeat = Math.floor(elapsed / rhythmState.beatIntervalMs);
            const cycleBeat = globalBeat % 8; // 0..3 = Demo Turn, 4..7 = Player Turn
            const beatInMeasure = cycleBeat % 4; // 0, 1, 2 (Hold Fist), 3 (Release Palm!)
            const isPlayerTurn = cycleBeat >= 4;

            if (globalBeat !== rhythmState.lastGlobalBeat) {
                rhythmState.lastGlobalBeat = globalBeat;

                const isTargetBeat = beatInMeasure === 3;
                soundEngine.playBeat(beatInMeasure, isPlayerTurn, isTargetBeat);

                // Count how many beats player held fist during beats 1-3
                if (isPlayerTurn && beatInMeasure < 3 && confirmedGesture === 'FIST_CHARGE') {
                    rhythmState.holdBeatsCount++;
                }

                // Update Phase Badge & Target Label
                if (!isPlayerTurn) {
                    rhythmPhaseBadge.textContent = '👀 示范回合 · 看节拍';
                    rhythmPhaseBadge.className = 'px-2.5 py-0.5 rounded-full bg-cyan-500/25 text-cyan-200 font-bold border border-cyan-400/30';
                    rhythmTargetLabel.textContent = RHYTHM_CHALLENGE.label;
                    if (beatInMeasure === 0) {
                        rhythmFeedbackText.textContent = RHYTHM_CHALLENGE.demoHint;
                        rhythmFeedbackText.className = 'text-xs font-bold tracking-wider text-cyan-200 h-4';
                    }
                    if (isTargetBeat) {
                        rhythmState.demoPulse = 1.0;
                    }
                } else {
                    rhythmPhaseBadge.textContent = '🎯 你的回合 · 跟拍蓄力发射';
                    rhythmPhaseBadge.className = 'px-2.5 py-0.5 rounded-full bg-amber-500/30 text-amber-200 font-bold border border-amber-400/40';
                    rhythmTargetLabel.textContent = '1-2-3 握拳蓄力 → 第 4 拍张开手掌！';
                    if (beatInMeasure === 0) {
                        rhythmState.playerHitThisRound = false;
                        rhythmState.holdBeatsCount = 0;
                        rhythmFeedbackText.textContent = '开始握拳蓄力：✊ 1 - ✊ 2 - ✊ 3 - 【🖐️ 第 4 拍张掌！】';
                        rhythmFeedbackText.className = 'text-xs font-bold tracking-wider text-amber-200 h-4';
                    }
                }

                // Update 4 beat dots visual highlight (Beats 0-2 = ✊, Beat 3 = 🖐️)
                beatDots.forEach((dot, idx) => {
                    if (idx === beatInMeasure) {
                        if (idx === 3) {
                            dot.className = isPlayerTurn
                                ? 'w-7 h-7 rounded-full bg-amber-400 text-slate-950 scale-125 shadow-lg shadow-amber-400/70 flex items-center justify-center text-xs font-black transition-all duration-100'
                                : 'w-7 h-7 rounded-full bg-cyan-400 text-slate-950 scale-125 shadow-lg shadow-cyan-400/70 flex items-center justify-center text-xs font-black transition-all duration-100';
                        } else {
                            dot.className = isPlayerTurn
                                ? 'w-6 h-6 rounded-full bg-amber-300/90 text-slate-950 scale-115 shadow-md shadow-amber-300/50 flex items-center justify-center text-[11px] font-bold transition-all duration-100'
                                : 'w-6 h-6 rounded-full bg-cyan-300/90 text-slate-950 scale-115 shadow-md shadow-cyan-300/50 flex items-center justify-center text-[11px] font-bold transition-all duration-100';
                        }
                    } else {
                        dot.className = idx === 3
                            ? 'w-6 h-6 rounded-full bg-amber-400/20 border-2 border-amber-300/50 flex items-center justify-center text-xs font-bold text-amber-200 transition-all duration-100'
                            : 'w-5 h-5 rounded-full bg-white/20 border border-white/30 flex items-center justify-center text-[10px] font-bold text-white/70 transition-all duration-100';
                    }
                });
            }

            // Render Holographic Demo Ghost Cue in Center during Demo Turn (1-3: growing fist, 4: open palm release!)
            if (!isPlayerTurn || rhythmState.demoPulse > 0.05) {
                const beatProgress = (elapsed % rhythmState.beatIntervalMs) / rhythmState.beatIntervalMs;
                const isReleaseBeat = beatInMeasure === 3;
                const holdScale = 0.85 + beatInMeasure * 0.14 + Math.sin(beatProgress * Math.PI) * 0.06;
                const scale = isReleaseBeat ? 1.32 - beatProgress * 0.22 : holdScale;
                const ghostIcon = isReleaseBeat ? '🖐️' : '✊';

                uiCtx.save();
                uiCtx.translate(width / 2, height * 0.46);
                uiCtx.scale(scale, scale);

                // Glowing rhythm ring
                uiCtx.beginPath();
                uiCtx.arc(0, 0, 56, 0, Math.PI * 2);
                uiCtx.fillStyle = isReleaseBeat ? 'rgba(251, 191, 36, 0.25)' : 'rgba(56, 189, 248, 0.16)';
                uiCtx.fill();
                uiCtx.lineWidth = isReleaseBeat ? 3.5 : 2.5;
                uiCtx.strokeStyle = isReleaseBeat ? 'rgba(253, 224, 71, 0.9)' : 'rgba(125, 211, 252, 0.55)';
                uiCtx.stroke();

                uiCtx.font = '42px sans-serif';
                uiCtx.textAlign = 'center';
                uiCtx.textBaseline = 'middle';
                uiCtx.fillText(ghostIcon, 0, 2);
                uiCtx.restore();

                rhythmState.demoPulse *= 0.88;
            }
        }

        /**
         * Evaluate if player releases open palm on the 4th beat after charging in beats 1-3
         */
        function checkRhythmBeatHit(detectedGesture) {
            if (!rhythmState.active || rhythmState.playerHitThisRound || detectedGesture !== 'OPEN_PALM') return false;
            const now = performance.now();
            const elapsed = now - rhythmState.startTime;
            const cycleMs = rhythmState.beatIntervalMs * 8;
            const posInCycle = elapsed % cycleMs;
            // Target moment is Beat 7 (4th beat of player's turn = 7 * beatIntervalMs)
            const targetTime = rhythmState.beatIntervalMs * 7;
            const delta = Math.abs(posInCycle - targetTime);

            if (delta <= 320) {
                rhythmState.playerHitThisRound = true;
                rhythmState.combo++;
                if (comboCountText) comboCountText.textContent = rhythmState.combo;

                const isPerfect = delta <= 165;
                rhythmFeedbackText.textContent = isPerfect
                    ? `✨ PERFECT! 第 4 拍完美释放 (Combo x${rhythmState.combo})`
                    : `👍 GOOD! 节拍命中 (Combo x${rhythmState.combo})`;
                rhythmFeedbackText.className = isPerfect
                    ? 'text-xs font-black tracking-wider text-amber-300 h-4'
                    : 'text-xs font-bold tracking-wider text-emerald-300 h-4';

                soundEngine.playPerfect();
                snowAccumulation = Math.min(100, snowAccumulation + 6);
                updateSnowMeterUI();
                return true;
            }
            return false;
        }

        /**
         * Flying Snowball Animation (towards glass screen)
         */
        function updateAndDrawFlyingSnowballs() {
            for (let i = flyingSnowballs.length - 1; i >= 0; i--) {
                const b = flyingSnowballs[i];
                b.progress += 0.085;
                if (b.progress >= 1) {
                    createSnowSplat(b.endX, b.endY, b.radius * 1.75);
                    soundEngine.playSplat();
                    flyingSnowballs.splice(i, 1);
                    continue;
                }

                const curX = b.startX + (b.endX - b.startX) * b.progress;
                const arcY = Math.sin(b.progress * Math.PI) * -65;
                const curY = b.startY + (b.endY - b.startY) * b.progress + arcY;
                const curR = b.radius * (0.65 + b.progress * 0.95);

                const grad = uiCtx.createRadialGradient(curX - curR * 0.25, curY - curR * 0.25, 2, curX, curY, curR);
                grad.addColorStop(0, '#ffffff');
                grad.addColorStop(0.75, '#e0f2fe');
                grad.addColorStop(1, 'rgba(186, 230, 253, 0.2)');

                uiCtx.beginPath();
                uiCtx.arc(curX, curY, curR, 0, Math.PI * 2);
                uiCtx.fillStyle = grad;
                uiCtx.fill();
            }
        }

        function createSnowSplat(x, y, radius) {
            const blobs = [];
            const count = 9;
            for (let i = 0; i < count; i++) {
                const angle = (i / count) * Math.PI * 2 + Math.random() * 0.4;
                const dist = radius * (0.35 + Math.random() * 0.55);
                blobs.push({
                    dx: Math.cos(angle) * dist,
                    dy: Math.sin(angle) * dist,
                    r: radius * (0.22 + Math.random() * 0.32),
                    dripSpeed: 0.25 + Math.random() * 0.45,
                    dripOffset: 0
                });
            }
            snowSplats.push({
                x,
                y,
                radius,
                blobs,
                alpha: 0.95,
                slideSpeed: 0.35 + Math.random() * 0.3
            });

            // Boost ground snow accumulation slightly on impact
            snowAccumulation = Math.min(100, snowAccumulation + 4.5);
            updateSnowMeterUI();
        }

        /**
         * Composite Frosted Glass Mask + Sliding/Fading Snow Splats onto frostCanvas
         */
        function updateAndDrawSplats() {
            frostCtx.clearRect(0, 0, width, height);
            frostCtx.drawImage(frostMaskCanvas, 0, 0);

            for (let i = snowSplats.length - 1; i >= 0; i--) {
                const sp = snowSplats[i];
                sp.y += sp.slideSpeed;
                sp.alpha -= 0.0028;

                if (sp.alpha <= 0 || sp.y - sp.radius > height) {
                    snowSplats.splice(i, 1);
                    continue;
                }

                frostCtx.save();
                frostCtx.globalAlpha = sp.alpha;
                frostCtx.fillStyle = 'rgba(248, 252, 255, 0.92)';

                // Central splat core
                frostCtx.beginPath();
                frostCtx.arc(sp.x, sp.y, sp.radius * 0.65, 0, Math.PI * 2);
                frostCtx.fill();

                // Dripping peripheral snow blobs
                for (const blob of sp.blobs) {
                    blob.dripOffset += blob.dripSpeed;
                    frostCtx.beginPath();
                    frostCtx.arc(sp.x + blob.dx, sp.y + blob.dy + blob.dripOffset, blob.r, 0, Math.PI * 2);
                    frostCtx.fill();
                }
                frostCtx.restore();
            }
        }

        /**
         * Draw Subtle Hand Skeleton Feedback on UI Canvas
         */
        const HAND_CONNECTIONS = [
            [0,1],[1,2],[2,3],[3,4],
            [0,5],[5,6],[6,7],[7,8],
            [5,9],[9,10],[10,11],[11,12],
            [9,13],[13,14],[14,15],[15,16],
            [13,17],[0,17],[17,18],[18,19],[19,20]
        ];

        function drawHandSkeleton(lm) {
            uiCtx.save();
            uiCtx.strokeStyle = 'rgba(125, 211, 252, 0.45)';
            uiCtx.lineWidth = 2;
            for (const [a, b] of HAND_CONNECTIONS) {
                uiCtx.beginPath();
                uiCtx.moveTo(lm[a].x, lm[a].y);
                uiCtx.lineTo(lm[b].x, lm[b].y);
                uiCtx.stroke();
            }
            for (let i = 0; i < lm.length; i++) {
                uiCtx.beginPath();
                uiCtx.arc(lm[i].x, lm[i].y, i === 8 ? 5 : 2.8, 0, Math.PI * 2);
                uiCtx.fillStyle = i === 8 ? '#38bdf8' : 'rgba(255, 255, 255, 0.75)';
                uiCtx.fill();
            }
            uiCtx.restore();
        }

        /**
         * Handle Hand Landmark Results (EMA Smoothing + Multi-Frame Confirmation + Dropout Tolerance)
         */
        function onHandResults(rawLandmarks) {
            const now = performance.now();

            if (!rawLandmarks || rawLandmarks.length === 0) {
                // Brief dropout tolerance to prevent wiping interruption
                if (now - lastDetectTime > LOST_TOLERANCE_MS) {
                    smoothedLandmarks = null;
                    lastWipePos = null;
                    if (now - lastChargedTime > 450) {
                        chargeProgress = 0;
                        savedCharge = 0;
                    }
                    if (confirmedGesture !== 'IDLE') {
                        confirmedGesture = 'IDLE';
                        gestureHistory = [];
                        updateGesturePill('等待手势中...', 'fa-hand-pointer', 'text-cyan-400');
                    }
                }
                return;
            }

            lastDetectTime = now;

            // 1. Exponential Moving Average (EMA) coordinate smoothing
            const alpha = 0.48;
            if (!smoothedLandmarks) {
                smoothedLandmarks = rawLandmarks.map(pt => ({
                    x: (1 - pt.x) * width, // Mirror X coordinate
                    y: pt.y * height,
                    z: pt.z
                }));
            } else {
                for (let i = 0; i < rawLandmarks.length; i++) {
                    const targetX = (1 - rawLandmarks[i].x) * width;
                    const targetY = rawLandmarks[i].y * height;
                    smoothedLandmarks[i].x += alpha * (targetX - smoothedLandmarks[i].x);
                    smoothedLandmarks[i].y += alpha * (targetY - smoothedLandmarks[i].y);
                    smoothedLandmarks[i].z = rawLandmarks[i].z;
                }
            }

            // 2. Classify gesture & confirm via multi-frame buffer
            const rawGesture = classifyGesture(smoothedLandmarks);
            gestureHistory.push(rawGesture);
            if (gestureHistory.length > HISTORY_LEN) {
                gestureHistory.shift();
            }

            evaluateConfirmedGesture();
        }

        /**
         * Classify 21 hand landmarks into core gestures
         */
        function classifyGesture(lm) {
            const wrist = lm[0];
            const indexMcp = lm[5], indexTip = lm[8];
            const middleMcp = lm[9], middleTip = lm[12];
            const ringTip = lm[16];
            const pinkyTip = lm[20];

            const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
            const palmScale = dist(wrist, middleMcp) || 1;

            // Extension checks
            const isIndexExt = dist(indexTip, wrist) > 1.3 * palmScale && dist(indexTip, indexMcp) > 0.55 * palmScale;
            const isMiddleExt = dist(middleTip, wrist) > 1.22 * palmScale;
            const isRingExt = dist(ringTip, wrist) > 1.2 * palmScale;
            const isPinkyExt = dist(pinkyTip, wrist) > 1.15 * palmScale;

            // Fist check
            const isFist = dist(indexTip, wrist) < 1.18 * palmScale &&
                           dist(middleTip, wrist) < 1.18 * palmScale &&
                           dist(ringTip, wrist) < 1.18 * palmScale &&
                           dist(pinkyTip, wrist) < 1.18 * palmScale;

            // Open palm check (at least 3 main fingers extended after charging, or all 4 extended)
            const extendedCount = [isIndexExt, isMiddleExt, isRingExt, isPinkyExt].filter(Boolean).length;
            const isOpenPalm = extendedCount >= 4 || (savedCharge >= 0.2 && extendedCount >= 3);

            if (isFist) return 'FIST_CHARGE';
            if (isOpenPalm) return 'OPEN_PALM';
            if (isIndexExt && !isFist) return 'INDEX_WIPE';
            return 'IDLE';
        }

        /**
         * Confirm gesture across consecutive frames & handle throw transition
         */
        function evaluateConfirmedGesture() {
            const now = performance.now();
            const counts = {};
            for (const g of gestureHistory) counts[g] = (counts[g] || 0) + 1;

            let maxCount = 0;
            let mode = confirmedGesture;
            for (const g in counts) {
                if (counts[g] > maxCount) {
                    maxCount = counts[g];
                    mode = g;
                }
            }

            // Immediate or confirmed launch when opening palm within 450ms of charging a snowball
            const latestRaw = gestureHistory[gestureHistory.length - 1];
            const effectiveCharge = Math.max(chargeProgress, (now - lastChargedTime <= 450) ? savedCharge : 0);

            if ((mode === 'OPEN_PALM' || latestRaw === 'OPEN_PALM') && effectiveCharge >= 0.2) {
                const hitOnBeat = checkRhythmBeatHit('OPEN_PALM');
                launchSnowball(hitOnBeat ? 1.0 : effectiveCharge);
                confirmedGesture = 'THROW';
                chargeProgress = 0;
                savedCharge = 0;
                lastChargedTime = 0;
                gestureHistory = ['THROW'];
                updateGesturePill(hitOnBeat ? '🎵 完美卡拍！发射超级雪球!' : '🖐️ 发射雪球!', 'fa-paper-plane', 'text-sky-300');
                return;
            }

            // Also check rhythm timing for Fist Charge or Index Wipe challenges
            if (mode === 'FIST_CHARGE' || mode === 'INDEX_WIPE') {
                checkRhythmBeatHit(mode);
            }

            // Clear expired charge if user switched to another non-throw gesture
            if (mode !== 'FIST_CHARGE' && now - lastChargedTime > 450) {
                chargeProgress = 0;
                savedCharge = 0;
            }

            confirmedGesture = mode;
            updateUIForGesture(confirmedGesture);
        }

        function updateUIForGesture(gesture) {
            if (gesture === 'INDEX_WIPE') {
                updateGesturePill('☝️ 食指擦除霜雾 / 轻戳雪人', 'fa-hand-point-up', 'text-cyan-300');
            } else if (gesture === 'FIST_CHARGE') {
                updateGesturePill('✊ 握拳蓄力雪球中...', 'fa-hand-fist', 'text-amber-300');
            } else if (gesture === 'OPEN_PALM') {
                updateGesturePill('🖐️ 张开手掌', 'fa-hand', 'text-sky-300');
            } else if (gesture !== 'THROW') {
                updateGesturePill('等待手势中...', 'fa-hand-pointer', 'text-cyan-400');
            }
        }

        function updateGesturePill(text, iconClass, colorClass) {
            gestureText.textContent = text;
            gestureIcon.className = `fa-solid ${iconClass} ${colorClass}`;
        }

        /**
         * Launch a snowball toward the frosted glass screen
         */
        function launchSnowball(power = 0.5) {
            if (!smoothedLandmarks) return;
            const handCenter = smoothedLandmarks[9];
            flyingSnowballs.push({
                startX: handCenter.x,
                startY: handCenter.y,
                endX: width / 2 + (Math.random() - 0.5) * (width * 0.45),
                endY: height / 2 + (Math.random() - 0.5) * (height * 0.38),
                progress: 0,
                radius: 24 + power * 20
            });
        }

        /**
         * Initialize MediaPipe HandLandmarker (Web Worker first, automatic Main-Thread & CPU fallback)
         */
        async function initHandLandmarker() {
            const modelUrl = await resolveModelUrl();
            try {
                const workerCode = `
                    import { FilesetResolver, HandLandmarker } from "${MP_VISION_URL}";
                    let handLandmarker = null;
                    self.onmessage = async (e) => {
                        const { type, bitmap, timestamp } = e.data;
                        if (type === 'INIT') {
                            try {
                                const vision = await FilesetResolver.forVisionTasks("${MP_WASM_DIR}");
                                try {
                                    handLandmarker = await HandLandmarker.createFromOptions(vision, {
                                        baseOptions: { modelAssetPath: "${modelUrl}", delegate: "GPU" },
                                        runningMode: "VIDEO",
                                        numHands: 1,
                                        minHandDetectionConfidence: 0.55,
                                        minHandPresenceConfidence: 0.55,
                                        minTrackingConfidence: 0.55
                                    });
                                } catch (gpuErr) {
                                    handLandmarker = await HandLandmarker.createFromOptions(vision, {
                                        baseOptions: { modelAssetPath: "${modelUrl}", delegate: "CPU" },
                                        runningMode: "VIDEO",
                                        numHands: 1,
                                        minHandDetectionConfidence: 0.55,
                                        minHandPresenceConfidence: 0.55,
                                        minTrackingConfidence: 0.55
                                    });
                                }
                                self.postMessage({ type: 'READY' });
                            } catch (err) {
                                self.postMessage({ type: 'ERROR', message: err.message });
                            }
                        } else if (type === 'DETECT' && handLandmarker && bitmap) {
                            try {
                                const res = handLandmarker.detectForVideo(bitmap, timestamp);
                                bitmap.close();
                                self.postMessage({ type: 'RESULT', landmarks: res.landmarks?.[0] || null });
                            } catch (err) {
                                bitmap.close();
                                self.postMessage({ type: 'RESULT', landmarks: null });
                            }
                        }
                    };
                `;

                const blob = new Blob([workerCode], { type: 'application/javascript' });
                const workerUrl = URL.createObjectURL(blob);
                const worker = new Worker(workerUrl, { type: 'module' });

                await new Promise((resolve, reject) => {
                    const timeout = setTimeout(() => reject(new Error('模型加载超时，请检查网络是否可访问 CDN 或将 hand_landmarker.task 放至同级目录')), 15000);
                    worker.onmessage = (e) => {
                        if (e.data.type === 'READY') {
                            clearTimeout(timeout);
                            resolve();
                        } else if (e.data.type === 'ERROR') {
                            clearTimeout(timeout);
                            reject(new Error(e.data.message));
                        }
                    };
                    worker.onerror = (err) => {
                        clearTimeout(timeout);
                        reject(err);
                    };
                    worker.postMessage({ type: 'INIT' });
                });

                worker.onmessage = (e) => {
                    if (e.data.type === 'RESULT') {
                        isProcessingFrame = false;
                        onHandResults(e.data.landmarks);
                    }
                };

                handWorker = worker;
                threadText.textContent = 'Web Worker 独立线程识别中';
                threadStatus.className = 'flex items-center gap-1 text-emerald-400 font-medium';
            } catch (workerErr) {
                console.warn('Web Worker unavailable, falling back to main thread:', workerErr);
                await fallbackToMainThread(modelUrl);
            }
        }

        async function fallbackToMainThread(modelUrl) {
            const { FilesetResolver, HandLandmarker } = await import(MP_VISION_URL);
            const vision = await FilesetResolver.forVisionTasks(MP_WASM_DIR);
            try {
                mainHandLandmarker = await HandLandmarker.createFromOptions(vision, {
                    baseOptions: { modelAssetPath: modelUrl, delegate: "GPU" },
                    runningMode: "VIDEO",
                    numHands: 1,
                    minHandDetectionConfidence: 0.55,
                    minHandPresenceConfidence: 0.55,
                    minTrackingConfidence: 0.55
                });
            } catch (_) {
                mainHandLandmarker = await HandLandmarker.createFromOptions(vision, {
                    baseOptions: { modelAssetPath: modelUrl, delegate: "CPU" },
                    runningMode: "VIDEO",
                    numHands: 1,
                    minHandDetectionConfidence: 0.55,
                    minHandPresenceConfidence: 0.55,
                    minTrackingConfidence: 0.55
                });
            }
            threadText.textContent = '主线程降级识别模式 (兼容)';
            threadStatus.className = 'flex items-center gap-1 text-amber-300 font-medium';
        }

        /**
         * Throttled Video Frame Dispatch to HandLandmarker
         */
        async function processVideoFrame(now) {
            if (video.readyState < 2 || isProcessingFrame || now - lastInferTime < INFER_INTERVAL_MS) {
                return;
            }
            lastInferTime = now;

            if (handWorker) {
                isProcessingFrame = true;
                try {
                    const bitmap = await createImageBitmap(video);
                    handWorker.postMessage({ type: 'DETECT', bitmap, timestamp: now }, [bitmap]);
                } catch (e) {
                    isProcessingFrame = false;
                }
            } else if (mainHandLandmarker) {
                const res = mainHandLandmarker.detectForVideo(video, now);
                onHandResults(res.landmarks?.[0] || null);
            }
        }

        /**
         * Main Render & Animation Loop
         */
        function renderLoop() {
            const now = performance.now();

            // Dispatch hand detection frame
            processVideoFrame(now);

            // 1. Background Video + Snowfall + Snowman
            bgCtx.clearRect(0, 0, width, height);
            if (video.readyState >= 2) {
                bgCtx.save();
                bgCtx.translate(width, 0);
                bgCtx.scale(-1, 1);
                const videoAspect = video.videoWidth / video.videoHeight;
                const canvasAspect = width / height;
                let drawW = width, drawH = height, offsetX = 0, offsetY = 0;
                if (canvasAspect > videoAspect) {
                    drawH = width / videoAspect;
                    offsetY = (height - drawH) / 2;
                } else {
                    drawW = height * videoAspect;
                    offsetX = (width - drawW) / 2;
                }
                bgCtx.drawImage(video, offsetX, offsetY, drawW, drawH);
                bgCtx.restore();
            }

            // Subtle winter blue atmospheric tint
            bgCtx.fillStyle = 'rgba(11, 25, 52, 0.25)';
            bgCtx.fillRect(0, 0, width, height);

            updateAndDrawSnowflakes();
            drawSnowGroundAndSnowman(now);

            // 2. Frosted Glass & Snow Splats
            updateAndDrawSplats();

            // 3. UI Overlay, Hand Landmarks, Wipe & Throw FX
            uiCtx.clearRect(0, 0, width, height);
            updateRhythmEngine(now);
            updateAndDrawFlyingSnowballs();

            if (smoothedLandmarks) {
                drawHandSkeleton(smoothedLandmarks);

                if (confirmedGesture === 'INDEX_WIPE') {
                    const indexTip = smoothedLandmarks[8];
                    wipeFrostInterpolated(lastWipePos, indexTip);
                    lastWipePos = { x: indexTip.x, y: indexTip.y };

                    // Check poke on snowman
                    checkSnowmanPoke(indexTip.x, indexTip.y, now);

                    // Draw subtle finger glow cursor
                    uiCtx.beginPath();
                    uiCtx.arc(indexTip.x, indexTip.y, 18, 0, Math.PI * 2);
                    uiCtx.strokeStyle = 'rgba(103, 232, 249, 0.8)';
                    uiCtx.lineWidth = 2.5;
                    uiCtx.stroke();
                } else if (confirmedGesture === 'FIST_CHARGE') {
                    lastWipePos = null;
                    chargeProgress = Math.min(1.0, chargeProgress + 0.03);
                    savedCharge = chargeProgress;
                    lastChargedTime = performance.now();
                    soundEngine.playCharge(chargeProgress);

                    // Draw glowing snowball charging aura around fist
                    const palm = smoothedLandmarks[9];
                    const r = 20 + chargeProgress * 32;
                    const grad = uiCtx.createRadialGradient(palm.x, palm.y, 4, palm.x, palm.y, r);
                    grad.addColorStop(0, 'rgba(255, 255, 255, 0.95)');
                    grad.addColorStop(0.6, 'rgba(186, 230, 253, 0.7)');
                    grad.addColorStop(1, 'rgba(56, 189, 248, 0)');
                    uiCtx.beginPath();
                    uiCtx.arc(palm.x, palm.y, r, 0, Math.PI * 2);
                    uiCtx.fillStyle = grad;
                    uiCtx.fill();
                } else {
                    lastWipePos = null;
                }
            }

            requestAnimationFrame(renderLoop);
        }

        /**
         * UI Button Event Listeners
         */
        startBtn.addEventListener('click', async () => {
            // 1. Trigger pure Web Audio BGM immediately in synchronous click handler
            soundEngine.startBgm();

            startBtn.disabled = true;
            startBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 正在连接摄像头...';

            if (window.self !== window.top) {
                try {
                    if (document.featurePolicy && !document.featurePolicy.allowsFeature('camera')) {
                        throw new Error('IFRAME_CAMERA_BLOCKED');
                    }
                } catch (_) {}
            }

            if (!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                modalDesc.innerHTML = `<span class="text-rose-400 font-semibold">浏览器安全限制拦截了摄像头：</span>当前页面未使用 <b>HTTPS</b> 协议访问，或被嵌入在未授权摄像头的沙盒容器（如 Google Sites）中。请独立部署至 Vercel / Netlify / GitHub Pages 后直接打开。`;
                startBtn.disabled = false;
                startBtn.innerHTML = '<i class="fa-solid fa-rotate-right"></i> 重新尝试启动';
                return;
            }

            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: 'user' },
                    audio: false
                });
                video.srcObject = stream;
                await video.play();
                soundEngine.reinitAfterCamera();
            } catch (camErr) {
                console.error('Camera access failed:', camErr);
                const isIframe = window.self !== window.top;
                modalDesc.innerHTML = isIframe
                    ? `<span class="text-rose-400 font-semibold">沙盒环境禁止调用摄像头：</span>Google Sites 等内嵌容器默认屏蔽摄像头权限。请将此 HTML 文件独立托管到 <b>Netlify Drop / Vercel / GitHub Pages</b> 生成独立网址后打开。`
                    : `<span class="text-rose-400 font-semibold">摄像头开启失败（${camErr.name || '权限受限'}）：</span>请检查浏览器地址栏左侧是否已允许摄像头权限，或确认摄像头未被其他软件占用。`;
                startBtn.disabled = false;
                startBtn.innerHTML = '<i class="fa-solid fa-rotate-right"></i> 重新尝试启动';
                return;
            }

            startBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 正在加载手势识别模型...';

            try {
                await initHandLandmarker();
                permissionModal.classList.add('hidden');
                rhythmState.active = true;
                rhythmState.startTime = performance.now();
                soundEngine.startBgm();
            } catch (modelErr) {
                console.error('Model loading failed:', modelErr);
                modalDesc.innerHTML = `<span class="text-rose-400 font-semibold">AI 手势模型加载失败：</span>当前网络无法访问外网 CDN 资源，请将 <code>hand_landmarker.task</code> 模型文件下载后放置于与本 HTML 同级的目录中再试。`;
                startBtn.disabled = false;
                startBtn.innerHTML = '<i class="fa-solid fa-rotate-right"></i> 重新加载模型';
            }
        });

        refrostBtn.addEventListener('click', () => {
            initFrostLayer();
            snowSplats = [];
            soundEngine.playPoke();
        });

        audioBtn.addEventListener('click', () => {
            soundEngine.toggleMute();
            if (!rhythmState.active) {
                rhythmState.active = true;
                rhythmState.startTime = performance.now();
            }
        });

        // Kick off animation loop on load
        window.addEventListener('load', () => {
            resizeCanvases();
            initFrostLayer();
            initSnowflakes();
            requestAnimationFrame(renderLoop);
        });
    </script>
</body>
