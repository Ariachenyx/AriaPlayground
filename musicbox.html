<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>拾光八音盒 · 18 音阶用车记忆乐谱</title>
  <style>
    :root {
      --bg-page: #faf7f2;
      --bg-card: #ffffff;
      --bg-subtle: #f4efe6;
      --bg-hover: #f9f5ee;
      --border-soft: #e6dccb;
      --border-gold: #d6b676;
      --text-main: #2c241b;
      --text-sub: #6e6152;
      --text-muted: #998b7a;
      --gold-primary: #c58f2a;
      --gold-deep: #9c6b14;
      --gold-light: #fdf4e3;
      --paper-bg: #fffdf9;
      --paper-grid: #eee5d5;
      --shadow-card: 0 8px 28px -6px rgba(92, 68, 32, 0.08), 0 2px 6px -1px rgba(92, 68, 32, 0.04);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: linear-gradient(180deg, #fcfaf6 0%, #f5efe4 100%);
      color: var(--text-main);
      min-height: 100vh;
      line-height: 1.5;
    }

    /* 顶部导航栏 */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(255, 253, 249, 0.88);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-soft);
    }

    .topbar-inner {
      max-width: 1320px;
      margin: 0 auto;
      padding: 14px 24px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: linear-gradient(135deg, #f3d085 0%, #cf9834 100%);
      color: #ffffff;
      font-size: 20px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(207, 152, 52, 0.3);
    }

    .brand-title-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .brand-title {
      font-family: "Songti SC", "Noto Serif SC", Georgia, serif;
      font-size: 19px;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: 0.3px;
    }

    .badge-tag {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 999px;
      background: #eef7f1;
      color: #2b7a4b;
      border: 1px solid #c6e6d2;
      font-weight: 600;
    }

    .brand-sub {
      font-size: 12px;
      color: var(--text-sub);
      margin-top: 2px;
    }

    /* 控制按钮组 */
    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    .segmented {
      display: inline-flex;
      background: var(--bg-subtle);
      border: 1px solid var(--border-soft);
      border-radius: 10px;
      padding: 3px;
    }

    .seg-btn {
      border: none;
      background: transparent;
      color: var(--text-sub);
      font-size: 12px;
      font-weight: 600;
      padding: 6px 11px;
      border-radius: 7px;
      cursor: pointer;
      transition: all 0.18s ease;
    }

    .seg-btn.active {
      background: #ffffff;
      color: var(--gold-deep);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
    }

    .tempo-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #ffffff;
      border: 1px solid var(--border-soft);
      border-radius: 10px;
      padding: 6px 12px;
      font-size: 12px;
      color: var(--text-sub);
    }

    .tempo-box input[type="range"] {
      width: 68px;
      accent-color: var(--gold-primary);
      cursor: pointer;
    }

    .tempo-val {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      color: var(--gold-deep);
      font-weight: 600;
      min-width: 52px;
    }

    .btn-primary {
      border: none;
      background: linear-gradient(135deg, #dfa742 0%, #bf8322 100%);
      color: #ffffff;
      font-size: 13px;
      font-weight: 600;
      padding: 8px 16px;
      border-radius: 10px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 14px rgba(191, 131, 34, 0.28);
      transition: transform 0.12s ease, filter 0.15s ease;
    }

    .btn-primary:hover {
      filter: brightness(1.05);
    }

    .btn-primary:active {
      transform: scale(0.97);
    }

    .btn-secondary {
      border: 1px solid var(--border-gold);
      background: var(--gold-light);
      color: var(--gold-deep);
      font-size: 12px;
      font-weight: 600;
      padding: 8px 12px;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn-secondary:hover {
      background: #f9ebd0;
    }

    /* 主容器网格 */
    .main-grid {
      max-width: 1320px;
      margin: 0 auto;
      padding: 24px;
      display: grid;
      grid-template-columns: 5fr 7fr;
      gap: 24px;
      align-items: start;
    }

    @media (max-width: 1024px) {
      .main-grid {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-soft);
      border-radius: 18px;
      box-shadow: var(--shadow-card);
      overflow: hidden;
    }

    .card-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border-soft);
      background: #fcfaf6;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .card-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .day-pill {
      font-size: 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      padding: 2px 8px;
      border-radius: 6px;
      background: var(--gold-light);
      color: var(--gold-deep);
      border: 1px solid var(--border-gold);
    }

    .card-desc {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 3px;
    }

    .link-btn {
      border: none;
      background: none;
      color: var(--text-sub);
      font-size: 12px;
      text-decoration: underline;
      text-underline-offset: 3px;
      cursor: pointer;
    }

    .link-btn:hover {
      color: var(--gold-deep);
    }

    /* 左侧列表 */
    .table-head {
      display: grid;
      grid-template-columns: 76px 1fr 68px;
      padding: 10px 20px;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-sub);
      background: var(--bg-subtle);
      border-bottom: 1px solid var(--border-soft);
    }

    .scale-list {
      max-height: 610px;
      overflow-y: auto;
    }

    .scale-row {
      display: grid;
      grid-template-columns: 76px 1fr 68px;
      align-items: center;
      padding: 9px 20px;
      border-bottom: 1px solid #f2ece1;
      transition: background 0.15s ease;
    }

    .scale-row:hover {
      background: var(--bg-hover);
    }

    .scale-row.checked {
      background: #fdf8ee;
    }

    .note-btn {
      width: 52px;
      padding: 4px 0;
      border-radius: 7px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      font-weight: 700;
      border: 1px solid var(--border-soft);
      background: #faf6ef;
      color: var(--gold-deep);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .note-btn:hover {
      border-color: var(--gold-primary);
      background: var(--gold-light);
    }

    .scale-row.checked .note-btn {
      background: linear-gradient(135deg, #e5b24c 0%, #c68b24 100%);
      color: #ffffff;
      border-color: #c68b24;
      box-shadow: 0 2px 6px rgba(198, 139, 36, 0.28);
    }

    .event-input {
      width: 100%;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-main);
      font-size: 13px;
      padding: 5px 8px;
      border-radius: 7px;
      transition: all 0.15s ease;
    }

    .event-input:hover {
      border-color: var(--border-soft);
      background: #ffffff;
    }

    .event-input:focus {
      outline: none;
      border-color: var(--gold-primary);
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(197, 143, 42, 0.12);
    }

    .check-wrap {
      display: flex;
      justify-content: flex-end;
    }

    .punch-toggle {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 1.5px solid #d5c9b6;
      background: #ffffff;
      color: transparent;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }

    .punch-toggle:hover {
      border-color: var(--gold-primary);
    }

    .punch-toggle.active {
      background: #d99b2e;
      border-color: #b87c16;
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(217, 155, 46, 0.38);
    }

    /* 右侧八音盒工作台 */
    .right-col {
      display: flex;
      flex-direction: column;
